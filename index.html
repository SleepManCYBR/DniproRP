  {"id":10,"b":2,"i":"i-book","nr":["РАЗДЕЛ I", "РОЗДІЛ I"],"ti":["ОБЩИЕ ПОЛОЖЕНИЯ", "ЗАГАЛЬНІ ПОЛОЖЕННЯ"],"nt":[],"r":[
    {"n":"1.1.1","h":["Презумпция невиновности","Презумпція невинуватості"],"t":0,"p":[["Лицо считается невиновным в совершении правонарушения, пока его вина не будет доказана в порядке, предусмотренном настоящим Кодексом.","Особа вважається невинуватою у вчиненні правопорушення, доки її вину не буде доведено в порядку, передбаченому цим Кодексом."],["Все сомнения относительно виновности лица трактуются в пользу этого лица.","Усі сумніви щодо винуватості особи трактуються на користь цієї особи."]],"pn":[],"i":""},
    {"n":"1.1.2","h":["Законность действий сотрудников правоохранительных органов","Законність дій працівників правоохоронних органів"],"t":0,"p":[["Сотрудники правоохранительных органов обязаны действовать исключительно на основании и в пределах полномочий, предусмотренных законодательством и правилами сервера.","Працівники правоохоронних органів зобов’язані діяти виключно на підставі та в межах повноважень, передбачених законодавством та правилами сервера."],["Запрещаются любые проявления самоуправства, превышения служебных полномочий или необоснованного применения силы.","Забороняються будь-які прояви самоуправління, перевищення службових повноважень або необґрунтованого застосування сили."]],"pn":[],"i":""}
  ]},
  {"id":11,"b":2,"i":"i-lock","nr":["РАЗДЕЛ II", "РОЗДІЛ II"],"ti":["ПОРЯДОК И СТАДИИ ЗАДЕРЖАНИЯ", "ПОРЯДОК ТА СТАДІЇ ЗАТРИМАННЯ"],"nt":[["<b>Примечание:</b> Если задержанный отвечает «Нет», сотрудник обязан повторить Миранду ещё один раз. Если после этого ответ снова отрицательный — повторное зачитывание не требуется.", "<b>Примітка:</b> Якщо затриманий відповідає «Ні», співробітник зобов’язаний повторити Міранду ще один раз. Якщо після цього відповідь знову негативна — повторне зачитування не вимагається."]],"r":[
    {"n":"","h":["Пошаговый алгоритм задержания","Покроковий алгоритм затримання"],"t":0,"p":[["Задержание лица должно осуществляться чётко по указанному алгоритму. Нарушение последовательности является основанием для освобождения задержанного лица.","Затримання особи має здійснюватися чітко за вказаним алгоритмом. Порушення послідовності є підставою для звільнення затриманої особи."]],"pn":[],"i":"i-clipboard"},
    {"n":"1","h":["Идентификация сотрудника","Ідентифікація працівника"],"t":0,"p":[["Представиться (назвать должность, звание и фамилию) или предъявить служебное удостоверение / бейджик (через /me или системный функционал).","Представитися (назвати посаду, звання та прізвище) або надати службове посвідчення / бейджик (через /me або системний функціонал)."]],"pn":[],"i":""},
    {"n":"2","h":["Озвучивание причины задержания","Озвучення причини затримання"],"t":0,"p":[["Чётко сообщить гражданину основание задержания (статья ККУ/АКУ или факт выявленного правонарушения).","Чітко повідомити громадянину підставу затримання (стаття ККУ/АКУ або факт виявленого правопорушення)."]],"pn":[],"i":""},
    {"n":"3","h":["Применение спецсредств","Застосування спецзасобів"],"t":0,"p":[["Надеть наручники (тайзер / задержание) с обязательной отыгровкой.","Одягнути кайданки (тайзер / затримання) з обов’язковим відіграванням."]],"pn":[],"i":""},
    {"n":"4","h":["Зачитывание прав (правило Миранды)","Зачитування прав (Правило Міранди)"],"t":0,"p":[["Зачитать права лица вслух или в игровой чат.","Зачитати права особи вголос або в ігровий чат."]],"pn":[],"i":""},
    {"n":"5","h":["Установление личности","Встановлення особи"],"t":0,"p":[["Проверить документы (паспорт, водительское удостоверение) или установить личность через планшет / фотобазу.","Перевірити документи (паспорт, посвідчення водія) або встановити особу через планшет / фотобазу."]],"pn":[],"i":""},
    {"n":"6","h":["Первичный / поверхностный осмотр","Первинний / поверхневий огляд"],"t":0,"p":[["Проверить лицо на наличие нелегального оружия, боеприпасов или веществ.","Перевірити особу на наявність нелегальної зброї, боєприпасів або речовин."]],"pn":[],"i":""},
    {"n":"7","h":["Транспортировка","Транспортування"],"t":0,"p":[["Посадить подозреваемого в служебное авто и доставить в отдел (НПУ / СБУ) или в подразделение ДКВС.","Посадити підозрюваного до службового авто та доставити до відділку (НПУ / СБУ) або підрозділу ДКВС."]],"pn":[],"i":""},
    {"n":"8","h":["Вторичный обыск и допрос (при необходимости)","Вторинний обшук та допит (за потреби)"],"t":0,"p":[["Провести полный обыск, изъять запрещённые предметы. При необходимости — предоставить право на звонок/адвоката.","Провести повний обшук, вилучити заборонені предмети. За потреби — надати право на дзвінок/адвоката."]],"pn":[],"i":""},
    {"n":"","h":["Текст Миранды","Текст Міранди"],"t":0,"p":[["Во время задержания сотрудник правоохранительных органов обязан зачитать следующий текст:","Під час затримання співробітник правоохоронних органів зобов’язаний зачитати наступний текст:"],["«Вы имеете право хранить молчание. Всё, что вы скажете, может и будет использовано против вас в суде.","«Ви маєте право зберігати мовчання. Все, що ви скажете, може і буде використано проти вас у суді."],["Вы имеете право на один телефонный звонок длительностью до 3 минут.","Ви маєте право на один телефонний дзвінок тривалістю до 3 хвилин."],["Вы имеете право на один визит государственного или частного адвоката.","Ви маєте право на один візит державного або приватного адвоката."],["Если вы не можете оплатить услуги адвоката, вам будет предоставлен государственный.","Якщо ви не можете оплатити послуги адвоката, вам буде надано державного."],["Вам понятны ваши права?»","Вам зрозумілі ваші права?»"]],"pn":[],"i":"i-scroll"}
  ]},
  {"id":12,"b":2,"i":"i-search","nr":["РАЗДЕЛ IV", "РОЗДІЛ IV"],"ti":["ОСНОВАНИЯ ДЛЯ ЗАДЕРЖАНИЯ И ОБЫСКА", "ПІДСТАВИ ДЛЯ ЗАТРИМАННЯ ТА ОБШУКУ"],"nt":[],"r":[
    {"n":"1.1.3","h":["Основания для задержания граждан","Підстави для затримання громадян"],"t":0,"p":[["Лицо может быть задержано в случае:","Особа може бути затримана у разі:"],["• Если лицо застигнуто непосредственно при совершении преступления или правонарушения.","• Застання особи безпосередньо під час вчинення злочину або правопорушення."],["• Наличия ориентировки, фотофиксации или решения суда/прокуратуры о задержании.","• Наявності орієнтування, фотофіксації або рішення суду/прокуратури про затримання."],["• Если на лице, его одежде, в автомобиле или в вещах обнаружены явные следы преступления (оружие без лицензии, наркотические вещества и т.д.).","• Якщо на особі, її одязі, в автівці або в речах виявлено явні сліди злочину (зброя без ліцензії, наркотичні речовини тощо)."],["• Нахождения лица в розыске (по базам данных).","• Перебування особи у розшуку (за базами даних)."]],"pn":[],"i":""},
    {"n":"1.1.4","h":["Поверхностный проверочный осмотр и обыск","Поверхневий перевірочний огляд та обшук"],"t":0,"p":[["Первичный осмотр проводится на месте задержания с целью безопасности сотрудников (поиск колюще-режущих предметов, огнестрельного оружия).","Первинний огляд проводиться на місці затримання з метою безпеки працівників (пошук колючо-ріжучих предметів, вогнепальної зброї)."],["Полный обыск проводится исключительно в помещении отдела (НПУ/СБУ) перед помещением лица в КПЗ/ИТТ.","Повний обшук проводиться виключно у приміщенні відділку (НПУ/СБУ) перед поміщенням особи до КПЗ/ІТТ."],["Во время полного обыска изымаются:","Під час повного обшуку вилучаються:"],["• Нелегальное оружие и боеприпасы.","• Нелегальна зброя та боєприпаси."],["• Наркотические и психотропные вещества.","• Наркотичні та психотропні речовини."],["• Отмычки, спецсредства и маски (если это предусмотрено правилами сервера).","• Відмички, спецзасоби та маски (якщо це передбачено правилами сервера)."]],"pn":[],"i":""}
  ]},
  {"id":13,"b":2,"i":"i-user","nr":["РАЗДЕЛ V", "РОЗДІЛ V"],"ti":["ПРАВА ЗАДЕРЖАННОГО И ПРИВЛЕЧЕНИЕ АДВОКАТА", "ПРАВА ЗАТРИМАНОГО ТА ЗАЛУЧЕННЯ АДВОКАТА"],"nt":[],"r":[
    {"n":"1.1.5","h":["Право на адвоката и телефонный звонок","Право на адвоката та телефонний дзвінок"],"t":0,"p":[["Задержанный имеет право требовать предоставления адвоката до момента помещения в КПЗ.","Затриманий має право вимагати надання адвоката до моменту поміщення в КПЗ."],["В случае вызова адвоката сотрудник правоохранительных органов обязан сделать запрос в рацию/Discord-канал коллегии адвокатов и подождать 10–15 минут.","У разі виклику адвоката, співробітник правоохоронних органів зобов’язаний зробити запит у рацію/Discord-канал колегії адвокатів та зачекати 10–15 хвилин."],["Если адвокат не принял вызов или не прибыл в течение установленного времени, процессуальные действия продолжаются без его участия.","Якщо адвокат не прийняв виклик або не прибув протягом визначеного часу, процесуальні дії продовжуються без його участі."],["Задержанный имеет право на один телефонный звонок (длительностью до 3 минут) в присутствии сотрудника.","Затриманий має право на один телефонний дзвінок (тривалістю до 3 хвилин) у присутності співробітника."]],"pn":[],"i":""}
  ]},
  {"id":14,"b":3,"i":"i-scale","nr":["КОДЕКС СУДЕБНОЙ ВЛАСТИ", "КОДЕКС СУДОВОЇ ВЛАДИ"],"ti":["ОБЩИЕ ПОЛОЖЕНИЯ", "ЗАГАЛЬНІ ПОЛОЖЕННЯ"],"nt":[],"r":[
    {"n":"","h":["Предмет регулирования","Предмет регулювання"],"t":0,"p":[["1. Настоящий Кодекс определяет правовые основы организации судебной власти, статус судей, а также общие принципы и порядок осуществления судопроизводства в гражданских, хозяйственных, административных и уголовных делах.","1. Цей Кодекс визначає правові засади організації судової влади, статус суддів, а також загальні принципи та порядок здійснення судочинства в цивільних, господарських, адміністративних та кримінальних справах."]],"pn":[],"i":"i-scroll"},
    {"n":"","h":["Задачи судебной власти","Завдання судової влади"],"t":0,"p":[["1. Задачей судебной власти является защита прав, свобод и законных интересов физических и юридических лиц, интересов общества и государства путём осуществления правосудия на основе верховенства права.","1. Завданням судової влади є захист прав, свобод та законних інтересів фізичних і юридичних осіб, інтересів суспільства і держави шляхом здійснення правосуддя на засадах верховенства права."]],"pn":[],"i":"i-scroll"},
    {"n":"","h":["Основные принципы правосудия","Основні засади (принципи) правосуддя"],"t":0,"p":[["1. Верховенство права: Правосудие осуществляется на основе верховенства права и уважения прав человека.","1. Верховенство права: Правосуддя здійснюється на основі верховенства права та поваги до прав людини."],["2. Независимость судей: Судьи при осуществлении правосудия независимы и подчиняются только закону. Влияние на судей любым способом запрещается.","2. Незалежність суддів: Судді при здійсненні правосуддя є незалежними та підкоряються лише закону. Вплив на суддів у будь-який спосіб забороняється."],["3. Равенство всех участников процесса: Все участники судебного процесса равны перед законом и судом.","3. Рівність усіх учасників процесу: Усі учасники судового процесу є рівними перед законом і судом."],["4. Гласность и открытость: Рассмотрение дел в судах является открытым, кроме случаев, определённых законом для защиты государственной или иной тайны.","4. Гласність і відкритість: Розгляд справ у судах є відкритим, крім випадків, визначених законом для захисту державної або іншої таємниці."],["5. Состязательность сторон: Стороны имеют равные права на представление доказательств, их исследование и доказывание перед судом их убедительности.","5. Змагальність сторін: Сторони мають рівні права щодо подання доказів, їх дослідження та доведення перед судом їх переконливості."],["6. Обязательность судебных решений: Судебное решение, вступившее в законную силу, является обязательным к исполнению на всей территории.","6. Обов’язковість судових рішень: Судове рішення, що набрало законної сили, є обов’язковим до виконання на всій території."]],"pn":[],"i":"i-scroll"}
  ]},
  {"id":15,"b":3,"i":"i-user","nr":["КОДЕКС СУДЕБНОЙ ВЛАСТИ", "КОДЕКС СУДОВОЇ ВЛАДИ"],"ti":["СТАТУС И ПОЛНОМОЧИЯ СУДЕЙ", "СТАТУС І ПОВНОВАЖЕННЯ СУДДІВ"],"nt":[],"r":[
    {"n":"","h":["Статус судьи и гарантии независимости","Статус судді та гарантії незалежності"],"t":0,"p":[["1. Судейская неприкосновенность и гарантии: Независимость судьи обеспечивается особым порядком его назначения, избрания, привлечения к ответственности и увольнения, а также надлежащим материальным и социальным обеспечением.","1. Суддівська недоторканність та гарантії: Незалежність судді забезпечується особливим порядком його призначення, обрання, притягнення до відповідальності та звільнення, а також належним матеріальним і соціальним забезпеченням."],["2. Добропорядочность и этика: Обязанность соблюдать высокие стандарты морали, профессиональной этики и предотвращать любой конфликт интересов.","2. Доброчесність та етика: Обов’язок дотримуватися високих стандартів моралі, професійної етики та запобігати будь-якому конфлікту інтересів."]],"pn":[],"i":"i-scroll"},
    {"n":"","h":["Органы судейского управления и самоуправления","Органи суддівського врядування та самоврядування"],"t":0,"p":[["1. Организационное обеспечение деятельности судов и защита профессиональных интересов судей осуществляются через Высший совет правосудия, Высшую квалификационную комиссию судей Украины и Совет судей Украины.","1. Організаційне забезпечення діяльності судів та захист професійних інтересів суддів здійснюються через Вищу раду правосуддя, Вищу кваліфікаційну комісію суддів України та Раду суддів України."]],"pn":[],"i":"i-scroll"},
    {"n":"","h":["Право судьи на ношение оружия","Право судді на носіння зброї"],"t":0,"p":[["1. С целью обеспечения личной безопасности и защиты от противоправных посягательств в связи с осуществлением правосудия судья имеет право на ношение и хранение оружия в порядке, установленном законодательством.","1. З метою забезпечення особистої безпеки та захисту від протиправних посягань у зв’язку зі здійсненням правосуддя, суддя має право на носіння та зберігання зброї у порядку, встановленому законодавством."]],"pn":[],"i":"i-scroll"},
    {"n":"","h":["Доступ судьи Верховного Суда на территории","Доступ судді Верховного Суду до територій"],"t":0,"p":[["1. Судья Верховного Суда для осуществления своей деятельности и выполнения профессиональных обязанностей имеет право беспрепятственного доступа и входа на любую территорию, объект или помещение.","1. Суддя Верховного Суду для здійснення своєї діяльності та виконання професійних обов’язків має право безперешкодного доступу та входу на будь-яку територію, об’єкт чи приміщення."]],"pn":[],"i":"i-scroll"}

  {"id":16,"b":3,"i":"i-scroll","nr":["КОДЕКС СУДЕБНОЙ ВЛАСТИ", "КОДЕКС СУДОВОЇ ВЛАДИ"],"ti":["СОСТАВ СУДА, УЧАСТНИКИ И ДОКАЗАТЕЛЬСТВА", "СКЛАД СУДУ, УЧАСНИКИ ТА ДОКАЗИ"],"nt":[],"r":[
    {"n":"","h":["Состав суда и участники процесса","Склад суду та учасники процесу"],"t":0,"p":[["1. Рассмотрение дел осуществляется судьёй единолично, коллегиально или с участием присяжных.","1. Розгляд справ здійснюється суддею одноособово, колегіально або за участю присяжних."],["2. Участниками процесса являются стороны (истец, ответчик, обвиняемый, потерпевший), прокурор, адвокат (представитель) и третьи лица.","2. Учасниками процесу є сторони (позивач, відповідач, обвинувачений, потерпілий), прокурор, адвокат (представник) та треті особи."],["3. Участники имеют право на правовую помощь, ознакомление с материалами дела, подачу ходатайств и выражение возражений.","3. Учасники мають право на правничу допомогу, ознайомлення з матеріалами справи, подання клопотань та висловлення заперечень."]],"pn":[],"i":"i-scroll"},
    {"n":"","h":["Доказательства и особенности доказывания","Докази та особливості доказування"],"t":0,"p":[["1. Доказательствами являются любые данные, на основании которых суд в установленном законом порядке устанавливает наличие или отсутствие обстоятельств дела (письменные, вещественные, электронные доказательства, заключения экспертов, показания свидетелей).","1. Доказами є будь-які дані, на підставі яких суд у визначеному законом порядку встановлює наявність або відсутність обставин справи (письмові, речові, електронні докази, висновки експертів, показання свідків)."],["2. Если судья был непосредственно при задержании лица, сторона обвинения освобождается от обязанности представления дополнительных доказательств относительно факта задержания и связанных с ним обстоятельств, подтверждённых личным наблюдением судьи.","2. Якщо суддя був безпосередньо присутнім під час затримання особи, сторона обвинувачення звільняється від обов’язку подання додаткових доказів щодо факту затримання та пов’язаних з ним обставин, підтверджених особистим спостереженням судді."]],"pn":[],"i":"i-scroll"}

const CATS = [
  { b: 1, i: "i-scroll", ru: "Штрафы и наказания", uk: "Штрафи та покарання" },
  { b: 2, i: "i-shield", ru: "Закон и структуры", uk: "Закон і структури" },
  { b: 3, i: "i-scale", ru: "Судебный кодекс", uk: "Судовий кодекс" }
];

const PN_ICON = { f: "i-coins", k: "i-lock", b: "i-ban", o: "i-info" };

const UI = {
  ru: {
    badge: "Официальные правила",
    sub: "Правила сервера DNIPRO RP. Выберите раздел или воспользуйтесь поиском.",
    cats: "раздела",
    arts: "статей",
    rules: "пунктов",
    langs: "языка",
    ph: "Поиск по правилам...",
    empty: "Ничего не найдено",
    emptySub: "Попробуйте изменить запрос",
    foot: "Незнание правил не освобождает от ответственности",
    found: "Найдено пунктов:",
    pn: "Наказание"
  },
  uk: {
    badge: "Офіційні правила",
    sub: "Правила сервера DNIPRO RP. Оберіть розділ або скористайтесь пошуком.",
    cats: "розділи",
    arts: "статей",
    rules: "пунктів",
    langs: "мови",
    ph: "Пошук за правилами...",
    empty: "Нічого не знайдено",
    emptySub: "Спробуйте змінити запит",
    foot: "Незнання правил не звільняє від відповідальності",
    found: "Знайдено пунктів:",
    pn: "Покарання"
  }
};

const $ = (s) => document.querySelector(s);
const state = { lang: "ru", b: 1, q: "", open: new Set() };

function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    localStorage.setItem(k, v);
  } catch (e) {
    return null;
  }
}

function esc(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function ico(id, cls) {
  return `<svg class="icon${cls ? " " + cls : ""}"><use href="#${id}"/></svg>`;
}

function strip(html) {
  return html.replace(/<[^>]+>/g, " ");
}

function hl(t, ql) {
  if (!ql) return esc(t);
  const low = t.toLowerCase();
  let out = "";
  let i = 0;
  while (true) {
    const j = low.indexOf(ql, i);
    if (j < 0) {
      out += esc(t.slice(i));
      break;
    }
    out += esc(t.slice(i, j)) + "<mark>" + esc(t.slice(j, j + ql.length)) + "</mark>";
    i = j + ql.length;
  }
  return out;
}

function pick(pair) {
  return pair[state.lang === "ru" ? 0 : 1];
}

function ruleText(r) {
  const L = state.lang === "ru" ? 0 : 1;
  let s = r.n + " ";
  if (r.h) s += r.h[L] + " ";
  if (r.t) s += r.t[L] + " ";
  r.p.forEach((p) => (s += p[L] + " "));
  r.pn.forEach((p) => (s += p[L + 1] + " "));
  return s.toLowerCase();
}

function countAll() {
  return DATA.reduce((a, x) => a + x.r.length, 0);
}

function renderStatic() {
  const t = UI[state.lang];
  document.documentElement.lang = state.lang;
  $("#tBadge").textContent = t.badge;
  $("#tSub").textContent = t.sub;
  $("#tCats").textContent = t.cats;
  $("#tArts").textContent = t.arts;
  $("#tRules").textContent = t.rules;
  $("#tLangs").textContent = t.langs;
  $("#sArts").textContent = DATA.length;
  $("#sRules").textContent = countAll();
  $("#q").placeholder = t.ph;
  $("#tEmpty").textContent = t.empty;
  $("#tEmptySub").textContent = t.emptySub;
  $("#tFoot").textContent = t.foot;
  $("#langSwitch").querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.lang === state.lang));
}

function renderTabs() {
  const box = $("#tabs");
  box.classList.toggle("dim", state.q.trim() !== "");
  box.innerHTML = CATS.map(
    (c) => `<button class="tab${c.b === state.b ? " active" : ""}" data-b="${c.b}">${ico(c.i)}<span>${esc(c[state.lang])}</span></button>`
  ).join("");
}

function renderChips() {
  const box = $("#chips");
  box.classList.toggle("hide", state.q.trim() !== "");
  box.innerHTML = DATA.filter((a) => a.b === state.b)
    .map((a) => `<button class="chip" data-id="${a.id}">${ico(a.i)}<span>${a.id}</span></button>`)
    .join("");
}

function ruleHtml(r, k, ql) {
  const L = state.lang === "ru" ? 0 : 1;
  const t = UI[state.lang];
  let badge = "";
  if (r.n) badge = `<span class="rn">${esc(r.n)}</span>`;
  else if (r.i) badge = `<span class="rn ico">${ico(r.i)}</span>`;
  let main = "";
  if (r.h) main += `<h4>${r.n && r.i ? ico(r.i) : ""}${hl(r.h[L], ql)}</h4>`;
  if (r.t) main += `<p>${hl(r.t[L], ql)}</p>`;
  r.p.forEach((p) => (main += `<p class="rp">${hl(p[L], ql)}</p>`));
  if (r.pn.length) {
    main += `<div class="pn"><em>${esc(t.pn)}</em>${r.pn
      .map((p) => `<span class="c ${p[0]}">${ico(PN_ICON[p[0]] || "i-info")}<span>${hl(p[L + 1], ql)}</span></span>`)
      .join("")}</div>`;
  }
  return `<div class="rule" style="--k:${k}">${badge}<div class="rule-main">${main}</div></div>`;
}

function renderList(animate) {
  const t = UI[state.lang];
  const L = state.lang === "ru" ? 0 : 1;
  const ql = state.q.trim().toLowerCase();
  const arts = ql ? DATA : DATA.filter((a) => a.b === state.b);
  let html = "";
  let found = 0;
  let idx = 0;
  arts.forEach((a) => {
    let rows = a.r;
    let noteHit = false;
    if (ql) {
      const titleHit = (a.ti[L] + " " + a.nr[L]).toLowerCase().includes(ql);
      noteHit = a.nt.some((n) => strip(n[L]).toLowerCase().includes(ql));
      rows = titleHit ? a.r : a.r.filter((r) => ruleText(r).includes(ql));
      if (!rows.length && !noteHit) return;
    }
    found += rows.length;
    const open = ql ? true : state.open.has(a.id);
    const notes = a.nt.map((n) => `<div class="note">${ico("i-pushpin")}<div>${n[L]}</div></div>`).join("");
    html += `<article class="sec${open ? " open" : ""}" id="a${a.id}" data-id="${a.id}" style="--i:${idx++}">
      <button class="sec-head" type="button" aria-expanded="${open}">
        <span class="sec-ico">${ico(a.i)}</span>
        <span class="sec-title"><small>${hl(a.nr[L], ql)}</small><h3>${hl(a.ti[L], ql)}</h3></span>
        <span class="sec-cnt">${rows.length}</span>
        <span class="sec-chev">${ico("i-chevron")}</span>
      </button>
      <div class="sec-body"><div class="sec-inner">
        <div class="rules">${rows.map((r, k) => ruleHtml(r, k, ql)).join("")}</div>${notes}
      </div></div>
    </article>`;
  });
  const list = $("#list");
  list.classList.toggle("anim", !!animate);
  list.innerHTML = html;
  $("#empty").classList.toggle("show", html === "");
  $("#meta").innerHTML = ql && html ? `${ico("i-search")}<span>${esc(t.found)} <b>${found}</b></span>` : "";
}

function renderAll(animate) {
  renderStatic();
  renderTabs();
  renderChips();
  renderList(animate);
}

function firstOpen() {
  state.open = new Set();
  const first = DATA.find((a) => a.b === state.b);
  if (first) state.open.add(first.id);
}

function setLang(l) {
  state.lang = l;
  store("dnipro-lang", l);
  renderAll(false);
}

$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab");
  if (!b) return;
  state.b = Number(b.dataset.b);
  state.q = "";
  $("#q").value = "";
  $("#qClear").classList.remove("show");
  firstOpen();
  renderAll(true);
});

function openArticle(id, scroll) {
  state.open.add(id);
  const sec = document.getElementById("a" + id);
  if (!sec) return;
  sec.classList.add("open");
  sec.querySelector(".sec-head").setAttribute("aria-expanded", "true");
  document.querySelectorAll("#chips .chip").forEach((c) => c.classList.toggle("on", Number(c.dataset.id) === id));
  if (scroll) setTimeout(() => sec.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
}

$("#chips").addEventListener("click", (e) => {
  const c = e.target.closest(".chip");
  if (c) openArticle(Number(c.dataset.id), true);
});

$("#list").addEventListener("click", (e) => {
  const head = e.target.closest(".sec-head");
  if (!head || state.q.trim()) return;
  const sec = head.parentElement;
  const id = Number(sec.dataset.id);
  const open = !sec.classList.contains("open");
  sec.classList.toggle("open", open);
  head.setAttribute("aria-expanded", open);
  if (open) state.open.add(id);
  else state.open.delete(id);
});

$("#list").addEventListener("pointermove", (e) => {
  const sec = e.target.closest(".sec");
  if (!sec) return;
  const r = sec.getBoundingClientRect();
  sec.style.setProperty("--mx", e.clientX - r.left + "px");
  sec.style.setProperty("--my", e.clientY - r.top + "px");
});

let timer = 0;
$("#q").addEventListener("input", (e) => {
  state.q = e.target.value;
  $("#qClear").classList.toggle("show", state.q !== "");
  clearTimeout(timer);
  timer = setTimeout(() => {
    renderTabs();
    renderChips();
    renderList(false);
  }, 120);
});

$("#qClear").addEventListener("click", () => {
  state.q = "";
  $("#q").value = "";
  $("#qClear").classList.remove("show");
  renderTabs();
  renderChips();
  renderList(false);
  $("#q").focus();
});

$("#langSwitch").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) setLang(b.dataset.lang);
});

document.querySelectorAll(".gate-btn").forEach((b) =>
  b.addEventListener("click", () => {
    setLang(b.dataset.pick);
    $("#langGate").classList.remove("show");
  })
);

const nav = $("#nav");
const toTop = $("#toTop");
window.addEventListener(
  "scroll",
  () => {
    const y = window.scrollY;
    nav.classList.toggle("scrolled", y > 30);
    toTop.classList.toggle("show", y > 600);
  },
  { passive: true }
);
toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

const saved = store("dnipro-lang");
if (saved === "ru" || saved === "uk") state.lang = saved;
firstOpen();
renderAll(true);

(function boot() {
  const loader = $("#loader");
  const fill = $("#loaderFill");
  const pct = $("#loaderPct");
  const MIN = 1700;
  const start = performance.now();
  let loaded = document.readyState === "complete";
  let finished = false;
  window.addEventListener("load", () => {
    loaded = true;
  });

  function finish() {
    if (finished) return;
    finished = true;
    loader.classList.add("done");
    document.body.classList.remove("is-locked");
    if (saved !== "ru" && saved !== "uk") {
      setTimeout(() => $("#langGate").classList.add("show"), 700);
    }
    setTimeout(() => loader.classList.add("gone"), 1400);
  }

  function tick(now) {
    const t = Math.min((now - start) / MIN, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    const cap = loaded ? 100 : 92;
    const v = Math.min(Math.round(eased * 100), cap);
    fill.style.width = v + "%";
    pct.textContent = v;
    if (v >= 100) {
      setTimeout(finish, 250);
      return;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  setTimeout(() => {
    loaded = true;
  }, 6000);
})();
</script>
